<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA - JARVIS HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --cyan: #00f3ff;
      --cyan-bright: #ffffff;
      --cyan-glow: rgba(0, 243, 255, 0.7);
      --cyan-dim: rgba(0, 243, 255, 0.25);
      --blue-deep: #0066ff;
      --amber: #ffaa00;
      --amber-glow: rgba(255, 170, 0, 0.8);
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Entire Arc Reactor is draggable */
    .jarvis-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.35));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-app-region: drag;
    }

    .jarvis-container:active {
      cursor: grabbing;
      transform: scale(0.98);
    }

    /* Outermost Dotted Orbital Ring */
    .ring-outer-dotted {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 243, 255, 0.35);
      animation: rotateClockwise 35s linear infinite;
    }

    /* Segmented Precision Caliper Ring */
    .ring-caliper {
      position: absolute;
      width: 226px;
      height: 226px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--cyan);
      border-bottom-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
      animation: rotateCounter 18s linear infinite;
    }

    /* Degree Ticks Ring */
    .ring-ticks {
      position: absolute;
      width: 196px;
      height: 196px;
      border-radius: 50%;
      border: 1px dotted rgba(0, 243, 255, 0.5);
      animation: rotateClockwise 12s linear infinite;
    }

    /* Circular Audio Frequency Waveform Canvas */
    #visualizerCanvas {
      position: absolute;
      width: 280px;
      height: 280px;
      pointer-events: none;
      z-index: 10;
    }

    /* Inner Holographic Arc Reactor Core */
    .reactor-core {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 45%, rgba(0, 102, 255, 0.5) 75%, transparent 100%);
      box-shadow: 0 0 30px var(--cyan), 0 0 60px var(--cyan-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
      animation: coreBreath 3s infinite ease-in-out;
      z-index: 5;
    }

    /* Center Aperture Hole */
    .core-center {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #030c18;
      border: 2px solid #ffffff;
      box-shadow: inset 0 0 16px var(--cyan), 0 0 15px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Small Central Sci-Fi Reticle */
    .reticle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--cyan);
      background: rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 8px var(--cyan);
    }

    /* Floating Status Label */
    .status-hud {
      position: absolute;
      bottom: 6px;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--cyan-glow);
      opacity: 0.85;
      pointer-events: none;
      transition: all 0.3s;
    }

    /* Holographic Voice Subtitle (fades in when speaking) */
    .speech-subtitle {
      position: absolute;
      bottom: -46px;
      max-width: 320px;
      text-align: center;
      color: #e6f9ff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      line-height: 1.35;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.7);
      background: rgba(4, 14, 28, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .speech-subtitle.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ─── Dynamic State Styles ─── */

    /* LISTENING STATE */
    body.state-listening .reactor-core {
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0.7) 85%);
      box-shadow: 0 0 45px #00f3ff, 0 0 80px rgba(0, 243, 255, 0.8);
      animation: coreListen 0.6s infinite alternate ease-in-out;
    }
    body.state-listening .ring-caliper {
      border-top-color: #00ff88;
      border-bottom-color: #00ff88;
      box-shadow: 0 0 25px #00ff88;
      animation-duration: 6s;
    }
    body.state-listening .status-hud {
      color: #00ff88;
      text-shadow: 0 0 12px #00ff88;
    }

    /* THINKING STATE */
    body.state-thinking .reactor-core {
      background: radial-gradient(circle, #ffffff 0%, var(--amber) 50%, rgba(255, 170, 0, 0.5) 80%);
      box-shadow: 0 0 40px var(--amber), 0 0 75px var(--amber-glow);
      animation: coreSpin 1s infinite linear;
    }
    body.state-thinking .ring-caliper {
      border-top-color: var(--amber);
      border-bottom-color: var(--amber);
      box-shadow: 0 0 20px var(--amber);
      animation-duration: 4s;
    }
    body.state-thinking .status-hud {
      color: var(--amber);
      text-shadow: 0 0 12px var(--amber-glow);
    }

    /* SPEAKING STATE */
    body.state-speaking .reactor-core {
      animation: coreSpeak 0.35s infinite alternate ease-in-out;
      box-shadow: 0 0 40px var(--cyan), 0 0 85px var(--cyan-glow);
    }
    body.state-speaking .ring-caliper {
      animation-duration: 8s;
    }

    /* Animations */
    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes coreBreath {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.9;
        box-shadow: 0 0 25px var(--cyan), 0 0 50px var(--cyan-glow);
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
        box-shadow: 0 0 38px var(--cyan), 0 0 75px var(--cyan-glow);
      }
    }

    @keyframes coreListen {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.15); filter: brightness(1.3); }
    }

    @keyframes coreSpeak {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.18); }
    }

    @keyframes coreSpin {
      0% { transform: rotate(0deg) scale(1.02); }
      100% { transform: rotate(360deg) scale(1.02); }
    }
  </style>
</head>
<body class="state-idle">

  <div class="jarvis-container pywebview-drag-region" id="jarvisCore" title="Click to talk / Say 'Hey Aura'">
    <canvas id="visualizerCanvas" width="280" height="280"></canvas>
    
    <div class="ring-outer-dotted"></div>
    <div class="ring-caliper"></div>
    <div class="ring-ticks"></div>
    
    <div class="reactor-core">
      <div class="core-center">
        <div class="reticle"></div>
      </div>
    </div>

    <div class="status-hud" id="statusText">JARVIS ONLINE</div>
    <div class="speech-subtitle" id="speechSubtitle">"Yes sir, how can I help?"</div>
  </div>

  <script>
    // ─── Web Audio Synthesizer for Authentic Jarvis Chimes ────────────────────
    class JarvisSFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playWake() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(1040, this.ctx.currentTime + 0.16);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(780, this.ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(1560, this.ctx.currentTime + 0.19);

          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.28);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start();
          osc2.start();
          osc1.stop(this.ctx.currentTime + 0.28);
          osc2.stop(this.ctx.currentTime + 0.28);
        } catch (e) {}
      }
      playAcknowledge() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + 0.14);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.18);
        } catch (e) {}
      }
    }

    const sfx = new JarvisSFX();

    // ─── Circular Holographic Waveform Visualizer ─────────────────────────────
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    let waveAmplitude = 6;
    let wavePhase = 0;
    let isSpeaking = false;

    function drawVisualizer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 72;
      const bars = 56;

      ctx.beginPath();
      for (let i = 0; i < bars; i++) {
        const angle = (i / bars) * Math.PI * 2;
        let barHeight = Math.sin(angle * 7 + wavePhase) * waveAmplitude;
        if (isSpeaking) {
          barHeight += (Math.random() * 16 + 6);
        } else if (document.body.classList.contains('state-listening')) {
          barHeight += (Math.random() * 10 + 4);
        }

        const r1 = radius;
        const r2 = radius + Math.max(3, barHeight);

        const x1 = cx + Math.cos(angle) * r1;
        const y1 = cy + Math.sin(angle) * r1;
        const x2 = cx + Math.cos(angle) * r2;
        const y2 = cy + Math.sin(angle) * r2;

        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
      }

      ctx.strokeStyle = document.body.classList.contains('state-thinking') ? '#ffaa00' : '#00f3ff';
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 12;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.stroke();

      wavePhase += 0.06;
      requestAnimationFrame(drawVisualizer);
    }
    requestAnimationFrame(drawVisualizer);

    // ─── States & Subtitle ───────────────────────────────────────────────────
    const statusText = document.getElementById('statusText');
    const speechSubtitle = document.getElementById('speechSubtitle');
    let subtitleTimeout = null;

    function setState(state, message) {
      document.body.className = `state-${state}`;
      if (message) {
        statusText.innerText = message;
      }
      if (state === 'speaking') {
        isSpeaking = true;
        waveAmplitude = 20;
      } else if (state === 'listening') {
        isSpeaking = false;
        waveAmplitude = 14;
        sfx.playWake();
      } else if (state === 'thinking') {
        isSpeaking = false;
        waveAmplitude = 10;
        sfx.playAcknowledge();
      } else {
        isSpeaking = false;
        waveAmplitude = 6;
      }
    }

    // Exposed to Python:
    window.setAuraState = function(state, message) {
      setState(state, message);
    };

    window.onAuraResponse = function(text) {
      if (text) {
        speechSubtitle.innerText = `"${text}"`;
        speechSubtitle.classList.add('visible');
        if (subtitleTimeout) clearTimeout(subtitleTimeout);
        subtitleTimeout = setTimeout(() => {
          speechSubtitle.classList.remove('visible');
        }, 8000);
      }
    };

    // Click on Arc Reactor to trigger manual voice input
    document.getElementById('jarvisCore').addEventListener('click', () => {
      sfx.init();
      setState('listening', 'LISTENING...');
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.listen_voice();
      }
    });
  </script>
</body>
</html>
